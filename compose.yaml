services:
  roster-scout:
    build: .
    ports:
      - "5050:5000"
    environment:
      ROSTER_SCOUT_CACHE_DIR: /var/cache/roster-scout
      DATABASE_URL: postgresql+psycopg://roster_scout:roster_scout@postgres:5432/roster_scout
      CELERY_BROKER_URL: redis://redis:6379/0
      BROWSERLESS_CAPACITY_BACKEND: postgresql
      BROWSERLESS_CAPACITY_NAMESPACE: roster-scout-browserless-account
      BROWSERLESS_ACCOUNT_MAX_SESSIONS: "2"
      FAILURE_EVIDENCE_RETENTION_DAYS: "28"
      NCAA_BROWSER_HEADLESS: "0"
      NCAA_BROWSER_FALLBACK: "1"
    volumes:
      - roster-scout-cache:/var/cache/roster-scout
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "scripts/run_worker.py"]
    profiles: ["worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://roster_scout:roster_scout@postgres:5432/roster_scout
      CELERY_BROKER_URL: redis://redis:6379/0
      BROWSERLESS_CAPACITY_BACKEND: postgresql
      BROWSERLESS_CAPACITY_NAMESPACE: roster-scout-browserless-account
      BROWSERLESS_ACCOUNT_MAX_SESSIONS: "2"
      CELERY_WORKER_CONCURRENCY: "1"
      REPORT_JOB_MAX_ATTEMPTS: "3"
      FAILURE_EVIDENCE_RETENTION_DAYS: "28"
    tmpfs:
      - /tmp/roster-scout-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A roster_scout.celery_app:celery_app inspect ping --destination \"celery@$${HOSTNAME}\" --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  scheduler:
    build: .
    command: ["python", "scripts/run_scheduler.py"]
    profiles: ["scheduler"]
    environment:
      DATABASE_URL: postgresql+psycopg://roster_scout:roster_scout@postgres:5432/roster_scout
      CELERY_BROKER_URL: redis://redis:6379/0
      REPORT_DISPATCH_POLL_SECONDS: "5"
      REPORT_DISPATCH_LEASE_SECONDS: "60"
      REPORT_QUEUED_REDISPATCH_SECONDS: "300"
      REPORT_RUNNING_STALE_SECONDS: "1800"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  purge:
    build: .
    command: ["python", "scripts/run_purge.py"]
    profiles: ["scheduler"]
    environment:
      DATABASE_URL: postgresql+psycopg://roster_scout:roster_scout@postgres:5432/roster_scout
      FAILURE_EVIDENCE_PURGE_SECONDS: "3600"
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "scripts/run_purge.py", "--check"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: roster_scout
      POSTGRES_PASSWORD: roster_scout
      POSTGRES_DB: roster_scout
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - roster-scout-postgres:/var/lib/postgresql/data
      - ./scripts/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roster_scout -d roster_scout"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

volumes:
  roster-scout-cache:
  roster-scout-postgres:
