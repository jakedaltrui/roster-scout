services:
  roster-scout:
    build: .
    ports:
      - "5050:5000"
    environment:
      ROSTER_SCOUT_CACHE_DIR: /var/cache/roster-scout
      DATABASE_URL: postgresql+psycopg://roster_scout:roster_scout@postgres:5432/roster_scout
      CELERY_BROKER_URL: redis://redis:6379/0
      NCAA_BROWSER_HEADLESS: "0"
      NCAA_BROWSER_FALLBACK: "1"
    volumes:
      - roster-scout-cache:/var/cache/roster-scout
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "scripts/run_worker.py"]
    profiles: ["worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://roster_scout:roster_scout@postgres:5432/roster_scout
      CELERY_BROKER_URL: redis://redis:6379/0
      BROWSERLESS_MAX_SESSIONS: "1"
      REPORT_JOB_MAX_ATTEMPTS: "3"
      FAILURE_EVIDENCE_RETENTION_DAYS: "30"
    tmpfs:
      - /tmp/roster-scout-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: roster_scout
      POSTGRES_PASSWORD: roster_scout
      POSTGRES_DB: roster_scout
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - roster-scout-postgres:/var/lib/postgresql/data
      - ./scripts/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roster_scout -d roster_scout"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

volumes:
  roster-scout-cache:
  roster-scout-postgres:
