app = "roster-scout"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "alembic upgrade head"

[processes]
  app = "xvfb-run -a gunicorn --bind 0.0.0.0:5000 --workers 1 --threads 4 --timeout 180 app:app"
  worker = "python scripts/run_worker.py"
  scheduler = "/bin/sh -c 'exec env -i PATH=\"$PATH\" PYTHONUNBUFFERED=1 DATABASE_URL=\"$DATABASE_URL\" CELERY_BROKER_URL=\"$CELERY_BROKER_URL\" REPORT_DISPATCH_POLL_SECONDS=\"$REPORT_DISPATCH_POLL_SECONDS\" REPORT_DISPATCH_LEASE_SECONDS=\"$REPORT_DISPATCH_LEASE_SECONDS\" REPORT_QUEUED_REDISPATCH_SECONDS=\"$REPORT_QUEUED_REDISPATCH_SECONDS\" REPORT_RUNNING_STALE_SECONDS=\"$REPORT_RUNNING_STALE_SECONDS\" python scripts/run_scheduler.py'"
  purge = "/bin/sh -c 'exec env -i PATH=\"$PATH\" PYTHONUNBUFFERED=1 LOG_LEVEL=INFO DATABASE_URL=\"$DATABASE_URL\" FAILURE_EVIDENCE_PURGE_SECONDS=\"$FAILURE_EVIDENCE_PURGE_SECONDS\" python scripts/run_purge.py'"

[env]
  PORT = "5000"
  ROSTER_SCOUT_CACHE_DIR = "/data"
  BROWSERLESS_CAPACITY_BACKEND = "postgresql"
  BROWSERLESS_CAPACITY_NAMESPACE = "roster-scout-browserless-account"
  BROWSERLESS_ACCOUNT_MAX_SESSIONS = "2"
  CELERY_WORKER_CONCURRENCY = "1"
  REPORT_DISPATCH_POLL_SECONDS = "5"
  REPORT_DISPATCH_LEASE_SECONDS = "60"
  REPORT_QUEUED_REDISPATCH_SECONDS = "300"
  REPORT_RUNNING_STALE_SECONDS = "1800"
  FAILURE_EVIDENCE_PURGE_SECONDS = "3600"
  NCAA_BROWSER_FALLBACK = "1"
  NCAA_BROWSER_PROVIDER = "browserless"
  NCAA_BROWSER_HEADLESS = "0"
  NCAA_BROWSER_CHANNEL = "chrome"
  NCAA_BROWSER_PREFLIGHT_TERMS = "1"
  NCAA_PROXY_TLS_VERIFY = "1"
  NCAA_SITE_UNBLOCKER = "0"
  NCAA_RESULT_CACHE_TTL_SECONDS = "21600"
  NCAA_LOOKUP_CACHE_TTL_SECONDS = "86400"
  TRUST_FLY_CLIENT_IP = "1"

[[mounts]]
  source = "roster_scout_cache"
  destination = "/data"
  initial_size = "3gb"
  processes = ["app"]

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 8
    hard_limit = 12

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/readyz"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
